    swords             = [];
    gems           = [];
    ducks            = [];
    floats             = [];
    particles                = [];
    effects              = [];
    boss                 = null;
    events           = [];
    notice = '';
    noticeFor = 0;
    shake = 0;
    combo = 0;
    comboFor = 0;
    upgradeToasts                    = [];
    upgrades                         = {};
    random              ;

            levelQueue = 0;
            upgradeReadyAt = 0;
            bladeAt = 0;
            thunderAt = 1.8;
            auraAt = 0;
            spawnAcc = 0;
            waveAt = MOW_WAVE_STEP;
            duckAt = 6;
            immunity = 0;
            serial = 0;
            orbitCd = new Map                ();

    constructor(random               = Math.random) {
        this.random = random;
    }

    get totalRescued() {
        return this.rescued + this.freed + this.rescueBonus;
    }
    get nextXp() {
        return 8 + 6 * (this.level - 1);
    }
    get progress() {
        return Math.min(1, this.level >= 30 ? 1 : this.xp / this.nextXp);
    }
            lv(id        ) {
        return this.upgrades[id] || 0;
    }
    get bladeCount() {
        return 6 + (this.character === 'shooter' ? 4 : 0) + 2 * this.lv('blades');
    }
    get bladeInterval() {
        return (this.character === 'shooter' ? .26 : .34) / (1 + .15 * this.lv('haste'));
    }
    get bladeDamage() {
        return (11 + 3.2 * (this.level - 1)) * (1 + .25 * this.lv('edge'));
    }
    get bladePierce() {
        return 2 + 2 * this.lv('pierce');
    }
    get orbitCount() {
        return (this.character === 'warrior' ? 3 : 1) + this.lv('orbit');
    }
    get orbitRadius() {
        return 74 + 6 * this.lv('orbit');
    }
    get thunderInterval() {
        return (this.character === 'mage' ? 1.5 : 2.3) / (1 + .2 * this.lv('thunder'));
    }
    get thunderRadius() {
        return 66 + 14 * this.lv('thunder');
    }
    get thunderCount() {
        return 1 + Math.floor(this.lv('thunder') / 2) + (this.character === 'mage' ? 1 : 0);
    }
    get thunderDamage() {
        return (26 + 5 * (this.level - 1)) * (1 + .3 * this.lv('thunder'));
    }
    get auraRadius() {
        return (this.character === 'warrior' ? 82 : 62) + 16 * this.lv('aura');
    }
    get auraDamage() {
        return (5 + 1.4 * (this.level - 1)) * (1 + .35 * this.lv('aura'));
    }
    get moveSpeed() {
        return 205 * (1 + .12 * this.lv('boots'));
    }
    get magnet() {
        return 62 + 30 * this.lv('magnet');
    }
    get critChance() {
        return .08 + .08 * this.lv('crit');
    }
    get killsPerDuck() {
        return Math.max(3, 8 - this.lv('mercy'));
    }
    get skillLevels()                                                  {
        return [
            { icon: '剑', level: 1 + this.lv('blades') + this.lv('haste'), hot: true },
            { icon: '环', level: this.orbitCount, hot: this.orbitCount > 1 },
            { icon: '雷', level: 1 + this.lv('thunder'), hot: this.lv('thunder') > 0 },
            { icon: '光', level: 1 + this.lv('aura'), hot: this.lv('aura') > 0 },
            { icon: '云', level: 1 + this.lv('boots') + this.lv('magnet'), hot: this.lv('boots') > 0 },
            { icon: '救', level: 1 + this.lv('mercy') + this.lv('vigor'), hot: this.lv('mercy') > 0 },
        ];
    }

    setViewport(w        , h        ) {
        this.viewWidth = w;
        this.viewHeight = h;
    }
    start(character               = this.character) {
        this.character = character;
        this.phase = 'playing';
        this.time = 0;
        this.hp = this.maxHp = 6;
        this.level = 1;
        this.xp = 0;
        this.kills = 0;
        this.score = 0;
        this.wave = 1;
        this.rescued = 0;
        this.freed = 0;
        this.rescueBonus = 0;
        this.deathCause = '';
        this.x = 0;
        this.y = 0;
        this.enemies = [];
        this.swords = [];
        this.gems = [];
        this.ducks = [];
        this.floats = [];
        this.particles = [];
        this.effects = [];
        this.boss = null;
        this.events = [];
        this.notice = '传送阵开启 · 厨妖潮涌来了！';
        this.noticeFor = 2.6;
        this.shake = 0;
        this.combo = 0;
        this.comboFor = 0;
        this.upgradeToasts = [];
        this.upgrades = {};
        this.facing = { x: 0, y: 1 };
        this.levelQueue = 0;
        this.upgradeReadyAt = 0;
        this.bladeAt = 0;
        this.thunderAt = 1.6;
        this.auraAt = 0;
        this.spawnAcc = 0;
        this.waveAt = MOW_WAVE_STEP;
        this.duckAt = 6;
        this.immunity = 0;
        this.serial = 0;
        this.orbitCd.clear();
        this.spawnDucks(3, true);
    }

    // ── 状态写入 helpers ────────────────────────────────────────
            announce(message        , event        ) {
        this.notice = message;
        this.noticeFor = 2.4;
        this.events.push(event);
    }
            effect(x        , y        , radius        , kind        , life = .4) {
        this.effects.push({ x, y, radius, kind, life, duration: life });
        if (this.effects.length > 70)
            this.effects.shift();
    }
            float(x        , y        , text        , kind                  ) {
        if (this.floats.length >= 60)
            return;
        this.floats.push({ x, y, text, kind, life: .72, duration: .72 });
    }
            burst(x        , y        , color        , count = 6, power = 130) {
        for (let i = 0; i < count && this.particles.length < 240; i++) {
            const a = this.random() * Math.PI * 2, v = power * (.4 + this.random() * .8);
            this.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                life: .35 + this.random() * .35, duration: .7, size: 3 + this.random() * 4, color });
        }
    }
            spawnDucks(count        , nearPortal = false) {
        const cx = nearPortal ? 0 : this.x, cy = nearPortal ? 0 : this.y;
        for (let i = 0; i < count && this.ducks.length < MOW_DUCK_CAP; i++) {
            const a = this.random() * Math.PI * 2;
            const r = nearPortal ? 110 + this.random() * 90 : 180 + this.random() * 220;
            this.ducks.push({
                x: Math.max(-820, Math.min(820, cx + Math.cos(a) * r)),
                y: Math.max(-820, Math.min(820, cy + Math.sin(a) * r)),
                bob: this.random() * Math.PI * 2,
            });
        }
    }

    // ── 升级：不弹窗、不冻结，战斗全程继续推进 ────────────────────
    /**
     * 按「当前等级越低越容易被选中」加权随机，让六格技能栏均匀成长，
     * 也不会把同一项一口气点满。只从未满级的项里挑。
     */
            autoUpgrade()          {
        const pool = MOW_UPGRADES.filter(u => this.lv(u.id) < u.max);
        if (!pool.length)
            return false;
        const weights = pool.map(u => 1 / (1 + this.lv(u.id) * .9));
        let roll = this.random() * weights.reduce((a, b) => a + b, 0);
        let picked = pool[pool.length - 1];
        for (let i = 0; i < pool.length; i++) {
            roll -= weights[i];
            if (roll <= 0) {
                picked = pool[i];
                break;
            }
        }
        return this.applyUpgrade(picked.id);
    }
    /** 立即生效一项升级。公开给局前配置、调试与测试复用。 */
    applyUpgrade(id        )          {
        const u = MOW_UPGRADES.find(x => x.id === id);
        if (!u || this.lv(id) >= u.max)
            return false;
        const level = this.lv(id) + 1;
        this.upgrades[id] = level;
        if (id === 'vigor') {
            this.maxHp++;
            this.hp = Math.min(this.maxHp, this.hp + 1);
        }
        if (id === 'snack')
            this.hp = Math.min(this.maxHp, this.hp + 1);
        if (id === 'spirit')
            this.experience(25); // 只累加 levelQueue，下几次 tick 再消费，不会递归
        this.immunity = Math.max(this.immunity, .18);
        this.upgradeToasts.push({ id, icon: u.icon, name: u.name, level, life: 2.2, duration: 2.2 });
        if (this.upgradeToasts.length > 3)
            this.upgradeToasts.shift();
        // 只发升级音效，不占用中央播报条：获得信息由右上角飘条独自承担。
        this.events.push('upgrade');
        this.effect(this.x, this.y, 120, 'upgrade', .6);
        this.burst(this.x, this.y, '#FFC94A', 16, 190);
        return true;
    }
            experience(value        ) {
        this.score += value;
        if (this.level >= 30)
            return;
        this.xp += value;
        while (this.level < 30 && this.xp >= this.nextXp) {
            this.xp -= this.nextXp;
            this.level++;
            this.levelQueue++;
            this.effect(this.x, this.y, 110, 'level', .6);
            this.burst(this.x, this.y, '#8FF3C8', 12, 160);
        }
        if (this.level >= 30)
            this.xp = 0;
    }

    // ── 怪潮 ───────────────────────────────────────────────────
            spawnEnemy(forceKind               , angle         , distScale = 1) {
        if (this.enemies.length >= MOW_ENEMY_CAP)
            return null;
        const r = this.random();
        let kind               = 'grunt';
        if (!forceKind) {
            if (this.time >= 35 && r < .09)
                kind = 'brute';
            else if (this.time >= 18 && r < .32)
                kind = 'runner';
        }
        else
            kind = forceKind;
        const a = angle ?? this.random() * Math.PI * 2, dx = Math.cos(a), dy = Math.sin(a);
        const d = Math.min((this.viewWidth / 2 + 46) / Math.max(.001, Math.abs(dx)),
            (this.viewHeight / 2 + 46) / Math.max(.001, Math.abs(dy))) * distScale;
        const hp = kind === 'brute' ? 72 + this.time * 2.2 : kind === 'runner' ? 8 + this.time * .18 : 12 + this.time * .28;
        const e           = {
            id: ++this.serial, kind,
            x: Math.max(-850, Math.min(850, this.x + dx * d)),
            y: Math.max(-850, Math.min(850, this.y + dy * d)),
            hp, maxHp: hp, radius: kind === 'brute' ? 25 : 15,
            speed: kind === 'brute' ? 52 : kind === 'runner' ? 125 : 78,
            flash: 0, wobble: this.random() * Math.PI * 2, dead: false,
        };
        this.enemies.push(e);
        return e;
    }
    // 怪潮以小队成团涌入，而不是均匀散点——割草的视觉密度来自成团的黑影。
            spawnPack() {
        const a = this.random() * Math.PI * 2;
        const n = 2 + Math.floor(this.random() * 3);
        for (let i = 0; i < n; i++)
            this.spawnEnemy(undefined, a + (this.random() - .5) * .5, .78 + this.random() * .28);
    }
            spawnRate() {
        return 6 + Math.min(16, this.time * .3) + (this.wave - 1) * 1.1;
    }
            callWave() {
        this.wave++;
        this.announce(`第 ${this.wave} 波 · 厨妖潮涌来！`, 'wave');
        this.shake = Math.max(this.shake, .5);
        for (let i = 0; i < 6 + this.wave * 2; i++)
            this.spawnEnemy();
        this.waveAt += MOW_WAVE_STEP;
    }

    // ── 伤害与击退 ─────────────────────────────────────────────
            damage(e                    , amount        , crit = false, show = true) {
        if ('dead' in e && e.dead)
            return;
        if ('state' in e && e.state === 'arrive')
            return;
        e.hp -= amount;
        e.flash = .14;
        if (show || crit)
            this.float(e.x, e.y + 18, (crit ? '✦' : '') + String(Math.round(amount)), crit ? 'crit' : 'damage');
        this.events.push('hit');
        if (e.hp > 0)
            return;
        if ('dead' in e) {
            if (e.dead)
                return;
            e.dead = true;
            this.kill(e);
        }
        else if (e.kind === 'boss') {
            // 胜负统一在 tick 末尾判定，避免同一帧里伤害与接触互相抢结论。
            this.shake = 1;
            this.burst(e.x, e.y, '#FFC94A', 30, 280);
        }
    }
            kill(e          ) {
        this.kills++;
        this.combo++;
        this.comboFor = 2.2;
        this.score += e.kind === 'brute' ? 8 : 2;
        this.events.push('kill');
        this.burst(e.x, e.y, e.kind === 'brute' ? '#FF8A5B' : '#6ED7B0',
            e.kind === 'brute' ? 14 : 5, e.kind === 'brute' ? 220 : 140);
        this.gems.push({ x: e.x, y: e.y, value: e.kind === 'brute' ? 5 : 1, bob: this.random() * 6 });
        if (this.gems.length > MOW_GEM_CAP)
            this.gems[0].value += this.gems.pop() .value;
        if (e.kind === 'brute') {
            this.rescued += 2;
            this.events.push('rescue');
            this.announce('砸开大锅盖 · 2 只鸭撤离！', 'rescue');
            this.effect(e.x, e.y, 90, 'rescue', .6);
            this.shake = Math.max(this.shake, .55);
        }
        this.freed = Math.floor(this.kills / this.killsPerDuck);
    }
            hurt(cause        , hearts = 1) {
        if (this.phase !== 'playing' || this.immunity > 0 || this.hp <= 0)
            return;
        this.hp -= hearts;
        this.immunity = .95;
        this.deathCause = cause;
        this.shake = Math.max(this.shake, .8);
        this.float(this.x, this.y + 24, '-' + hearts, 'damage');
        this.events.push('hurt');
    }

    // ── 四路自动输出 ────────────────────────────────────────────
            nearest(range        ) {
        let best                  = null, d = range;
        for (const e of this.enemies) {
            if (e.dead)
                continue;
            const dist = Math.hypot(e.x - this.x, e.y - this.y);
            if (dist < d) { d = dist; best = e; }
        }
        return best;
    }
            fireBlades() {
        const target = this.nearest(480);
        const angle = target ? Math.atan2(target.y - this.y, target.x - this.x)
            : Math.atan2(this.facing.y, this.facing.x);
        this.facing = { x: Math.cos(angle), y: Math.sin(angle) };
        const n = this.bladeCount, spread = Math.min(1.05, .18 + n * .05);
        for (let i = 0; i < n && this.swords.length < 240; i++) {
            const a = angle + (n === 1 ? 0 : (i / (n - 1) - .5) * 2 * spread) + (this.random() - .5) * .07;
            const crit = this.random() < this.critChance;
            this.swords.push({
                x: this.x, y: this.y, dx: Math.cos(a), dy: Math.sin(a),
                left: 360 + 22 * this.lv('pierce'), speed: 480 + this.random() * 90,
                damage: this.bladeDamage * (crit ? 1.9 : 1), pierce: this.bladePierce,
                hit: [], crit,
            });
        }
        this.events.push('shot');
    }
            updateSwords(dt        ) {
        const hittable                         = this.enemies.filter(e => !e.dead);
        if (this.boss && this.boss.hp > 0 && this.boss.state !== 'arrive')
            hittable.push(this.boss);
        for (const s of this.swords) {
            const travel = Math.min(s.left, s.speed * dt), ax = s.x, ay = s.y;
            s.x += s.dx * travel;
            s.y += s.dy * travel;
            s.left -= travel;
            const hits = hittable.filter(e => !s.hit.includes(e.id)).map(e => {
                const t = Math.max(0, Math.min(travel, (e.x - ax) * s.dx + (e.y - ay) * s.dy));
                return { e, t, d: Math.hypot(e.x - ax - s.dx * t, e.y - ay - s.dy * t) };
            }).filter(h => h.d <= (h.e.kind === 'boss' ? 46 : h.e.radius + 8)).sort((a, b) => a.t - b.t);
            for (const { e } of hits) {
                s.hit.push(e.id);
                this.damage(e, s.damage, s.crit);
                if (--s.pierce <= 0) { s.left = 0; break; }
            }
        }
        this.swords = this.swords.filter(s => s.left > 0);
    }
            updateOrbit(dt        ) {
        for (const [id, cd] of this.orbitCd) {
            const next = cd - dt;
            if (next <= 0) this.orbitCd.delete(id);
            else this.orbitCd.set(id, next);
        }
        const n = this.orbitCount, R = this.orbitRadius, spin = this.time * 3.4;
        const dmg = this.bladeDamage * .7;
        for (let i = 0; i < n; i++) {
            const a = spin + i * Math.PI * 2 / n;
            const px = this.x + Math.cos(a) * R, py = this.y + Math.sin(a) * R;
            for (const e of this.enemies) {
                if (e.dead || Math.hypot(e.x - px, e.y - py) > e.radius + 13)
                    continue;
                if (this.orbitCd.has(e.id))
                    continue;
                this.orbitCd.set(e.id, .3);
                this.damage(e, dmg, false, false);
            }
        }
    }
            updateThunder(dt        ) {
        this.thunderAt -= dt;
        if (this.thunderAt > 0)
            return;
        this.thunderAt = this.thunderInterval;
        const candidates = this.enemies.filter(e => !e.dead && Math.hypot(e.x - this.x, e.y - this.y) < 420);
        const targets                             = [];
        for (let i = 0; i < this.thunderCount; i++) {
            if (candidates.length)
                targets.push(candidates[Math.floor(this.random() * candidates.length) % candidates.length]);
            else {
                const a = this.random() * Math.PI * 2, r = 80 + this.random() * 220;
                targets.push({ x: this.x + Math.cos(a) * r, y: this.y + Math.sin(a) * r });
            }
        }
        const R = this.thunderRadius, dmg = this.thunderDamage;
        for (const t of targets) {
            this.effect(t.x, t.y, R, 'thunder', .45);
            this.burst(t.x, t.y, '#FFE07A', 8, 170);
            for (const e of this.enemies)
                if (!e.dead && Math.hypot(e.x - t.x, e.y - t.y) <= R)
                    this.damage(e, dmg, false, false);
            if (this.boss && this.boss.hp > 0 && this.boss.state !== 'arrive'
                && Math.hypot(this.boss.x - t.x, this.boss.y - t.y) <= R + 40)
                this.damage(this.boss, dmg, false, false);
        }
        this.shake = Math.max(this.shake, .3);
        this.events.push('thunder');
    }
            updateAura(dt        ) {
        this.auraAt -= dt;
        if (this.auraAt > 0)
            return;
        this.auraAt = .35;
        for (const e of this.enemies)
            if (!e.dead && Math.hypot(e.x - this.x, e.y - this.y) <= this.auraRadius)
                this.damage(e, this.auraDamage, false, false);
    }

    // ── Boss ────────────────────────────────────────────────────
            spawnBoss() {
        const a = -Math.PI / 2 + (this.random() - .5) * .8;
        const bx = Math.max(-760, Math.min(760, this.x + Math.cos(a) * 260));
        const by = Math.max(-760, Math.min(760, this.y + Math.sin(a) * 260));
        this.boss = { id: -1, kind: 'boss', x: bx, y: by, hp: 4200, maxHp: 4200, radius: 46, flash: 0,
            state: 'arrive', timer: 1.1, dx: 0, dy: -1 };
        this.announce('巨型捕鸭夹现身！', 'boss');
        this.shake = 1;
        this.effect(bx, by, 160, 'boss', .9);
    }
            updateBoss(dt        ) {
        const b = this.boss ;
        b.timer -= dt;
        b.flash = Math.max(0, b.flash - dt);
        if (b.state === 'arrive') {
            if (b.timer <= 0) {
                b.state = 'windup';
                b.timer = .85;
                const a = Math.atan2(this.y - b.y, this.x - b.x);
                b.dx = Math.cos(a); b.dy = Math.sin(a);
                this.events.push('warning');
            }
            return;
        }
        if (b.state === 'windup') {
            if (b.timer <= 0) { b.state = 'dash'; b.timer = .5; }
            return;
        }
        if (b.state === 'dash') {
            b.x = Math.max(-820, Math.min(820, b.x + b.dx * 360 * dt));
            b.y = Math.max(-820, Math.min(820, b.y + b.dy * 360 * dt));
            if (Math.hypot(b.x - this.x, b.y - this.y) < b.radius + 14)
                this.hurt('巨型捕鸭夹冲撞', 2);
            if (b.timer <= 0) { b.state = 'recover'; b.timer = 1.1; }
            return;
        }
        if (b.state === 'recover' && b.timer <= 0) {
            b.state = 'roar';
            b.timer = .6;
            for (let i = 0; i < 12; i++)
                this.spawnEnemy('grunt');
            this.events.push('warning');
            return;
        }
        if (b.state === 'roar' && b.timer <= 0) {
            b.state = 'windup';
            b.timer = .85;
            const a = Math.atan2(this.y - b.y, this.x - b.x);
            b.dx = Math.cos(a); b.dy = Math.sin(a);
        }
    }

    // ── 主循环 ──────────────────────────────────────────────────
    tick(dt        , mx        , my        ) {
        if (this.phase !== 'playing')
            return;
        dt = Math.max(0, Math.min(dt, .05));
        this.time += dt;
        // 升级在世界推进中自动发放，绝不暂停战斗、不弹窗让玩家做选择。
        // 一次拾取跨多级时每 0.42 秒发一项，飘条错开、音效不叠爆。
        if (this.levelQueue > 0 && this.time >= this.upgradeReadyAt) {
            this.levelQueue--;
            if (this.autoUpgrade())
                this.upgradeReadyAt = this.time + .42;
        }
        this.upgradeToasts = this.upgradeToasts.filter(t => (t.life -= dt) > 0);
        this.immunity -= dt;
        this.noticeFor -= dt;
        this.comboFor -= dt;
        if (this.comboFor <= 0) this.combo = 0;
        this.shake = Math.max(0, this.shake - dt * 2.4);
        const m = Math.hypot(mx, my);
        if (m > 0) {
            this.x = Math.max(-850, Math.min(850, this.x + mx / m * this.moveSpeed * dt));
            this.y = Math.max(-850, Math.min(850, this.y + my / m * this.moveSpeed * dt));
        }
        // 波次与刷怪
        if (this.time >= this.waveAt && this.time < this.bossAt)
            this.callWave();
        if (this.time < this.bossAt) {
            this.spawnAcc += dt * this.spawnRate();

        }
        this.updateSwords(dt);
        this.updateOrbit(dt);
        this.updateThunder(dt);
        this.updateAura(dt);

        for (const e of this.enemies) {
            if (e.dead)

            const vy = dx / d * Math.sin(wob) + dy / d * Math.cos(wob);
            e.x += vx * e.speed * dt;
            e.y += vy * e.speed * dt;
            if (d < e.radius + 14)

        }
        this.enemies = this.enemies.filter(e => !e.dead);

        if (!this.boss && this.time >= this.bossAt)
            this.spawnBoss();
        if (this.boss)
            this.updateBoss(dt);
        // 魂珠吸附与拾取
        this.gems = this.gems.filter(gem => {
            const d = Math.hypot(gem.x - this.x, gem.y - this.y);
            if (d <= 20) {
                this.experience(gem.value);
                this.events.push('pickup');
                return false;
            }
            if (d < this.magnet) {
                const pull = Math.min(d, (this.magnet - d) * 3.4 * dt + 55 * dt);

                gem.y += (this.y - gem.y) / d * pull;

        this.ducks = this.ducks.filter(d => {
            if (Math.hypot(d.x - this.x, d.y - this.y) >= MOW_DUCK_RADIUS)
                return true;

            this.effect(d.x, d.y, 70, 'rescue', .55);
            this.burst(d.x, d.y, '#8FF3C8', 10, 160);
            this.notice = '又一只鸭经传送阵撤离！';
            this.noticeFor = 1.4;
            return false;
        });
        // 表现层数据衰减
        this.floats = this.floats.filter(f => (f.life -= dt) > 0);
        this.particles = this.particles.filter(p => {
            p.life -= dt;
            p.x += p.vx * dt; p.y += p.vy * dt;
            p.vx *= .92; p.vy *= .92;

        });
        this.effects = this.effects.filter(e => (e.life -= dt) > 0);
        // 判定：先判阵亡，再判通关，最后判超时
        if (this.hp <= 0) {
            this.hp = 0;
            this.phase = 'lost';
            this.events.push('end');
        }
        else if (this.boss && this.boss.hp <= 0) {
            this.phase = 'won';
            this.rescueBonus = MOW_WIN_BONUS;
            this.announce('巨型捕鸭夹碎了！鸭子们自由了', 'end');
            this.events.push('end');
        }
        else if (this.time >= this.limit) {
            this.time = this.limit;
            this.deathCause = '出口被封锁';
            this.phase = 'lost';
            this.events.push('end');
        }
        if (this.events.length > 64)
            this.events = this.events.slice(-64);
    }
}

            ctx.fillStyle = col(C.white, .16); ctx.fillRect(x - r, y - r, r * 2, 5);
            ctx.fillStyle = C.danger; ctx.fillRect(x - r * .6, y - 2, r * .35, r * .35); ctx.fillRect(x + r * .2, y - 2, r * .35, r * .35);
            if (e.flash > 0) ring(x, y, r + 6, C.white, clamp(e.flash / .14, 0, 1) * .86, 3);
            if (e.kind === 'brute') {
                fillCard(x - 26, y - 40, 52, 7, 3, C.ink, .68);
                fillCard(x - 26, y - 40, 52 * clamp(e.hp / e.maxHp, 0, 1), 7, 3, C.coral, 1);
            }
        }
        const b = g.boss;
        if (b) {
            const x = sx(b.x), y = sy(b.y);
            if (b.state === 'windup') {
                ctx.strokeStyle = col(C.danger, .6); ctx.lineWidth = 26; ctx.beginPath();
                ctx.moveTo(x, y); ctx.lineTo(x + b.dx * 260, y - b.dy * 260); ctx.stroke();
            }
            glow(x, y, 120, C.coral, .14, 5);
            ctx.fillStyle = '#E2636E'; ctx.beginPath();
            ctx.moveTo(x - 42, y + 34); ctx.lineTo(x, y - 40); ctx.lineTo(x + 42, y + 34);
            ctx.lineTo(x + 20, y + 46); ctx.lineTo(x, y); ctx.lineTo(x - 20, y + 46); ctx.closePath(); ctx.fill();
            circle(x, y, 20, C.gold);
            ctx.fillStyle = C.ink; ctx.fillRect(x - 10, y - 4, 5, 8); ctx.fillRect(x + 5, y - 4, 5, 8);
            fillCard(W / 2 - 75, 152, 150, 12, 6, C.ink, .68);
            fillCard(W / 2 - 75, 152, 150 * clamp(b.hp / b.maxHp, 0, 1), 12, 6, C.coral, 1);
            text('巨型捕鸭夹', W / 2, 140, 17, C.ink, true);
        }
        // 万剑
        for (const s of g.swords) {
            const x = sx(s.x), y = sy(s.y);
            if (Math.abs(x - W / 2) > W / 2 + 60 || Math.abs(y - H / 2) > H / 2 + 60) continue;
            const len = s.crit ? 46 : 36, tx = x - s.dx * len, ty = y + s.dy * len;
            const edge = s.crit ? C.lilac : C.swordEdge;
            ctx.lineCap = 'round';
            ctx.strokeStyle = col(edge, .22); ctx.lineWidth = s.crit ? 14 : 10;
            ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(x, y); ctx.stroke();
            ctx.strokeStyle = col(edge, .92); ctx.lineWidth = s.crit ? 7 : 5;
            ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(x, y); ctx.stroke();
            ctx.strokeStyle = col(C.white, .95); ctx.lineWidth = 2.2;
            ctx.beginPath(); ctx.moveTo(tx + s.dx * 5, ty - s.dy * 5); ctx.lineTo(x, y); ctx.stroke();
            ctx.fillStyle = s.crit ? C.white : C.sword;
            diamond(x, y, s.crit ? 6 : 4.5, s.crit ? C.white : C.sword, 1);
        }
        // 护身剑阵
        const spin = g.time * 3.4;
        for (let i = 0; i < g.orbitCount; i++) {
            const a = spin + i * Math.PI * 2 / g.orbitCount;
            const x = W / 2 + Math.cos(a) * g.orbitRadius, y = H / 2 - Math.sin(a) * g.orbitRadius;
            glow(x, y, 18, C.gold, .12, 3);
            diamond(x, y, 9, C.sword, 1);
        }
        // 主角鸭
        glow(W / 2, H / 2, 44, C.gold, .1, 4);
        ring(W / 2, H / 2, 27, C.white, .88, 3);
        duck(W / 2, H / 2 + 8, 1.35);
        // 特效
        for (const f of g.effects) {
            const x = sx(f.x), y = sy(f.y), t = 1 - f.life / f.duration, r = f.radius * (.35 + .65 * t);
            const hex = f.kind === 'thunder' ? C.gold : f.kind === 'level' ? C.mint
                : f.kind === 'upgrade' ? C.gold : f.kind === 'rescue' ? C.mint : f.kind === 'boss' ? C.danger : C.lilac;
            ring(x, y, r, hex, .86 * (1 - t), f.kind === 'level' ? 6 : 4);
            if (f.kind === 'thunder') {
                ctx.strokeStyle = col(C.white, .9 * (1 - t)); ctx.lineWidth = 3; ctx.beginPath();
                ctx.moveTo(x - 8, y - 150); ctx.lineTo(x + 6, y - 40); ctx.lineTo(x - 5, y - 12); ctx.lineTo(x + 9, y + 40); ctx.stroke();
            }
        }
        for (const q of g.particles) {
            const x = sx(q.x), y = sy(q.y);
            if (Math.abs(x - W / 2) > W / 2 + 20 || Math.abs(y - H / 2) > H / 2 + 20) continue;
            ctx.fillStyle = col(q.color, .9 * clamp(q.life / q.duration, 0, 1));
            ctx.fillRect(x - q.size / 2, y - q.size / 2, q.size, q.size);
        }
        // 伤害数字
        for (const f of g.floats) {
            const a = clamp(f.life / .28, 0, 1);
            const hex = f.kind === 'crit' ? C.crit : f.kind === 'rescue' ? '#1E9E72' : f.kind === 'heal' ? '#3CB37A' : C.damage;
            text(f.text, sx(f.x), sy(f.y) - (1 - f.life / f.duration) * 42, f.kind === 'crit' ? 26 : 20, col(hex, a), true);
        }
    }
    function hud() {
        fillCard(14, 16, W - 28, 132, 24, C.panel, .93, C.edge, .92, 3);
        fillCard(26, 30, W - 52, 6, 3, C.gold, .78);
        for (let i = 0; i < g.maxHp; i++) heart(36 + i * 26, 68, 9, i < g.hp);
        const barW = W - 60;
        fillCard(30, 138, barW, 9, 5, C.shade, 1);
        fillCard(30, 138, Math.max(9, barW * g.progress), 9, 5, C.mint, 1);
        const left = Math.max(0, Math.ceil((g.boss ? g.limit : g.duration) - g.time));
        const mm = String(Math.floor(left / 60)).padStart(2, '0'), ss = String(left % 60).padStart(2, '0');
        text(mm + ':' + ss + '   第 ' + g.wave + ' 波   Lv.' + g.level, W / 2, 74, 24, C.ink, true);
        text('击退 ' + g.kills + '   救出 ' + g.totalRescued + ' 只   连斩 ' + g.combo, W / 2, 104, 18, C.inkSoft);
        text('万剑 ×' + g.bladeCount + ' · 剑阵 ' + g.orbitCount + ' · 雷劫 ' + g.thunderCount + ' · 领域 ' + Math.round(g.auraRadius), W / 2, 126, 17, C.inkSoft);
        fillCard(14, H - 112, W - 28, 96, 24, C.panel, .93, C.edge, .92, 3);
        const slotW = (W - 44) / 6, slotColors = [C.gold, C.mintLight, C.lilac, C.sun, C.grassB, C.coral];
        g.skillLevels.forEach((sk, i) => {
            const cx = W / 2 + (i - 2.5) * slotW;
            fillCard(cx - slotW / 2 + 5, H - 102, slotW - 10, 76, 14, sk.hot ? slotColors[i] : C.shade, sk.hot ? .92 : .7, sk.hot ? C.goldDeep : C.edge, .75, 2);
            text(sk.icon + ' ' + sk.level, cx, H - 64, 18, sk.hot ? C.goldDeep : C.inkSoft, true);
        });
        const tip = g.boss ? '击败巨型捕鸭夹！剩余 ' + Math.max(0, Math.ceil(g.limit - g.time)) + ' 秒'
            : '捡绿色魂珠自动成长 · 每 ' + g.killsPerDuck + ' 次击退多救 1 只鸭';
        fillCard(W / 2 - Math.min(W - 48, Math.max(250, tip.length * 16)) / 2, H - 154, Math.min(W - 48, Math.max(250, tip.length * 16)), 38, 19, C.panel, .86, C.edge, .62, 2);
        text(tip, W / 2, H - 135, 18, C.ink, true);
        if (g.noticeFor > 0) {
            const bw = Math.min(W - 56, Math.max(260, g.notice.length * 27));
            fillCard(W / 2 - bw / 2, 322, bw, 58, 29, C.panel, .92, C.gold, .8, 2);
            text(g.notice, W / 2, 351, 23, C.goldDeep, true);
        }
        if (toast > 0) {
            fillCard(W / 2 - 170, H - 300 - (1 - toast) * 50, 340, 48, 24, C.panel, .94, C.mint, .86, 2);
            text('+' + toastCount + ' 只鸭免于上餐桌', W / 2, H - 276 - (1 - toast) * 50, 21, C.mint, true);
        }
        if (finger !== -1) {
            const ox = W / 2 + origin.x, oy = H / 2 - origin.y;
            circle(ox, oy, 68, C.panel, .37); ring(ox, oy, 68, C.ink, .28, 3);
            circle(ox + stick.x * 50, oy - stick.y * 50, 21, C.mint, .82);
        }
    }
    /** 自动升级飘条：右上角依次滑入，纯展示，不铺遮罩、不拦输入、不暂停世界。 */
    function upgradeToasts() {
        g.upgradeToasts.forEach((t, i) => {
            const fade = Math.min(1, t.life / .45);
            const x = W - 311, y = 218 + i * 54;
            const inT = Math.max(0, Math.min(1, (t.duration - t.life) / .18));
            const slide = (1 - inT) * 60;
            fillCard(x + slide, y, 290, 46, 23, C.panel, .94 * fade, C.gold, .82 * fade, 2);
            circle(x + 26 + slide, y + 23, 7, C.gold, fade);
            text(t.icon + ' ' + t.name + ' Lv.' + t.level, x + 158 + slide, y + 23, 20, col(C.ink, fade), true);
        });
    }
    function introFx() {
        const t = 1 - intro / 1.1, fade = Math.min(1, t * 5) * Math.min(1, (1 - t) * 5);
        const R = 80 + 170 * Math.min(1, t * 1.6), spin = clock * 3.2;
        ctx.fillStyle = col(C.panel, .84 * fade); ctx.fillRect(0, 0, W, H);
        glow(W / 2, H / 2, R * 2.4, C.mint, .2 * fade, 6);
        glow(W / 2, H / 2, R * 1.3, C.gold, .17 * fade, 5);
        for (let k = 0; k < 3; k++) ring(W / 2, H / 2, R * (1 - k * .24), [C.gold, C.mint, C.lilac][k], (.9 - k * .2) * fade, 5 - k);
        ctx.strokeStyle = col(C.white, .78 * fade); ctx.lineWidth = 3; ctx.beginPath();
        for (let i = 0; i < 16; i++) {
            const a = spin + i * Math.PI / 8;
            ctx.moveTo(W / 2 + Math.cos(a) * R * .82, H / 2 + Math.sin(a) * R * .82);
            ctx.lineTo(W / 2 + Math.cos(a) * R * .97, H / 2 + Math.sin(a) * R * .97);
        }
        ctx.stroke();
        duck(W / 2, H / 2 + 20, clamp(t * 2.2, .05, 1) * 3.4);
        text('传送阵启动 · 鸭子入场！', W / 2, H / 2 + 130, 26, col(C.goldDeep, fade), true);
    }
    function settlement() {
        const t = clamp(settleFor / 2, 0, 1), R = 70 + 60 * ease(Math.min(1, t * 1.5));
        ctx.fillStyle = col(C.panel, .88); ctx.fillRect(0, 0, W, H);
        glow(W / 2, H / 2 - 40, R * 2.6, C.mint, .18, 6);
        ring(W / 2, H / 2 - 40, R, C.gold, .9, 6);
        ring(W / 2, H / 2 - 40, R * .74, C.white, .86, 3);
        const n = Math.min(12, Math.max(1, Math.floor(g.totalRescued / 4)));
        for (let i = 0; i < n; i++) {
            const a = i * 2.399 + clock * .6, rise = ease(Math.min(1, t * 1.3 + i * .03));
            const rr2 = (20 + (i % 4) * 16) * (1 - rise * .7);
            duck(W / 2 + Math.cos(a) * rr2, H / 2 - 40 - Math.sin(a) * rr2 * .6 - rise * 90, 1 - rise * .45);
        }
        text(g.phase === 'won' ? '突围成功！' : '战斗结束', W / 2, 180, 40, C.goldDeep, true);
        text('点按任意处跳过', W / 2, H - 120, 19, C.inkSoft);
    }
    function menuPanel() {
        ctx.fillStyle = col(C.panel, .68); ctx.fillRect(0, 0, W, H);
        glow(W / 2, 230, 380, C.gold, .16, 7);
        ring(W / 2, 230, 82, C.gold, .82, 5);
        ring(W / 2, 230, 98, C.white, .75, 2.5);
        duck(W / 2, 236, 2.2);
        fillCard(20, 320, W - 40, 480, 32, C.panel, .9, C.edge, .92, 3);
        fillCard(38, 336, W - 76, 6, 3, C.gold, .7);
        text('鸭命要紧', W / 2, 380, 52, C.goldDeep, true);
        text('万剑自动清场 · 捡魂珠自动成长 · 救鸭免于上餐桌', W / 2, 430, 19, C.inkSoft);
        text('选择职业鸭', W / 2, 480, 19, C.inkSoft);
        const names = ['御剑鸭', '剑阵鸭', '引雷鸭'];
        names.forEach((n, i) => {
            const x = W / 2 + (i - 1) * 140;
            fillCard(x - 64, 510, 128, 88, 16, charSel === i ? C.gold : C.shade, charSel === i ? .95 : .8,
                charSel === i ? C.goldDeep : C.edge, .8, 2);
            text(n, x, 542, 20, charSel === i ? C.goldDeep : C.ink, true);
            text(charSel === i ? '✓ 已选择' : '点击选择', x, 574, 16, C.inkSoft);
        });
        button(W / 2, 670, 400, 76, '开始割草', true);
        text('单指拖动 / WASD 移动 · 武器全自动', W / 2, 745, 18, C.inkSoft);
        text('成长自动发放、不打断战斗 · 每 ' + g.killsPerDuck + ' 次击退多救 1 只鸭', W / 2, 772, 18, C.inkSoft);
        text('经典模式请在微信体验版中切换', W / 2, 799, 17, C.inkSoft);
        text('按 Enter / 空格 也可开局', W / 2, 860, 17, C.inkSoft);
    }
    function pausePanel() {
        ctx.fillStyle = col(C.panel, .68); ctx.fillRect(0, 0, W, H);
        fillCard(20, 320, W - 40, 480, 32, C.panel, .92, C.edge, .92, 3);
        text('暂停一下', W / 2, 390, 46, C.goldDeep, true);
        text('Lv.' + g.level + ' · 击退 ' + g.kills + ' · 救出 ' + g.totalRescued + ' 只', W / 2, 470, 21, C.ink);
        text('万剑 ×' + g.bladeCount + ' · 剑阵 ' + g.orbitCount + ' · 雷劫 ' + g.thunderCount, W / 2, 510, 19, C.inkSoft);
        button(W / 2, 680, 400, 76, '继续割草', true);
        text('按 Esc / Enter 继续', W / 2, 750, 17, C.inkSoft);
    }
    function resultPanel() {
        ctx.fillStyle = col(C.panel, .68); ctx.fillRect(0, 0, W, H);
        fillCard(20, 320, W - 40, 480, 32, C.panel, .92, C.edge, .92, 3);
        text(g.phase === 'won' ? '突围成功！' : '被做成鸭货了…', W / 2, 375, 42, C.goldDeep, true);
        text(g.totalRescued + ' 只鸭', W / 2, 450, 62, C.goldDeep, true);
        text('免于上餐桌', W / 2, 505, 26, C.ink, true);
        text('传送阵撤离 ' + g.rescued + ' 只 · 斩妖放生 ' + g.freed + ' 只'
            + (g.rescueBonus ? ' · 突围加成 ' + g.rescueBonus + ' 只' : ''), W / 2, 548, 17, C.inkSoft);
        text('第 ' + g.wave + ' 波 · Lv.' + g.level + ' · 击退 ' + g.kills
            + ' · 万剑 ×' + g.bladeCount, W / 2, 582, 18, C.inkSoft);
        text('用时 ' + Math.floor(g.time) + ' 秒' + (g.deathCause ? ' · 死因：' + g.deathCause : ''), W / 2, 610, 17, C.inkSoft);
        button(W / 2, 680, 400, 76, '再来一局', true);
        text('按 Enter / 空格 也可重开', W / 2, 750, 17, C.inkSoft);
    }

    let prev = performance.now();
    function frame(now) {
        const dt = Math.min(.05, (now - prev) / 1000);
        prev = now; clock += dt;
        const mx = stick.x + Number(keys.has('d') || keys.has('ArrowRight')) - Number(keys.has('a') || keys.has('ArrowLeft'));
        const my = stick.y + Number(keys.has('w') || keys.has('ArrowUp')) - Number(keys.has('s') || keys.has('ArrowDown'));
        if (g.phase === 'playing' && intro > 0) intro = Math.max(0, intro - dt);
        else g.tick(dt, mx, my);
        const events = g.events.slice(); g.events = [];
        if (events.includes('level')) beep(980);
        else if (events.includes('upgrade')) beep(900);
        else if (events.includes('thunder')) beep(170);
        else if (events.includes('hurt')) beep(110);
        else if (events.includes('rescue')) beep(720);
        else if (events.includes('kill')) beep(650);
        else if (events.includes('shot')) beep(300);
        if (g.totalRescued !== lastRescued) { toastCount = g.totalRescued - lastRescued; lastRescued = g.totalRescued; toast = 1.1; }
        toast = Math.max(0, toast - dt);
        if (g.phase === 'won' || g.phase === 'lost') {
            if (settleFor < 0) settleFor = 0;
            else if (settleFor < 2) settleFor += dt;
        } else settleFor = -1;
        ctx.save();
        const sh = g.shake * 9, ox = Math.sin(clock * 61) * sh, oy = Math.cos(clock * 47) * sh;
        backdrop();
        const inGame = g.phase === 'playing' || g.phase === 'paused';
        if (inGame) {
            ctx.translate(ox, oy);
            ground(); worldLow(); worldHigh();
            ctx.translate(-ox, -oy);
            hud();
            if (intro > 0) introFx();
            upgradeToasts();
            if (g.phase === 'paused') pausePanel();
        } else if ((g.phase === 'won' || g.phase === 'lost') && settleFor >= 0 && settleFor < 2) {
            settlement();
        } else if (g.phase === 'menu') menuPanel();
        else resultPanel();
        ctx.restore();
        requestAnimationFrame(frame);
    }
    // 调试/截图入口：?auto=1 直接开局，&fast=N 快进 N 秒战斗，便于验收画面。
    const params = new URLSearchParams(location.search);
    window.__mow = { g, startRun, skipIntro: () => { intro = 0; } };
    if (params.has('auto')) {
        startRun();
        intro = 0;
        const secs = Math.min(90, Number(params.get('fast') || 0));
        for (let i = 0; i < secs * 60; i++) {
            g.tick(1 / 60, Math.sin(i / 40) * .6, Math.cos(i / 33) * .6);
            if (g.phase !== 'playing') break;
        }
        // ?upgrade=1 强制显示一组飘条用于画面验收（仅调试参数）。
        if (params.has('upgrade')) {
            g.experience(g.nextXp + 1);
            for (let i = 0; i < 60 && !g.upgradeToasts.length; i++)
                g.tick(.05, 0, 0);
            // duration 略大于 life，保持「已入场」状态，避免调试飘条停在滑入途中被裁切。
            g.upgradeToasts.forEach(t => { t.life = 99; t.duration = 100; });
        }
    }
    requestAnimationFrame(frame);
})();

</script>
