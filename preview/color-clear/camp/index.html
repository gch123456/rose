<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff4de"><title>鸭命要紧 · 救援营地</title><link rel="stylesheet" href="./style.css"></head><body>
<main id="camp-shell"><section id="camp-view" aria-label="救援营地">
<div class="camp-art" role="img" aria-label="法师鸭等待解救，营地伙伴正在准备救援"></div>
<header class="camp-header"><button id="camp-settings" class="round" aria-label="打开设置">⚙</button><span class="system-safe" aria-hidden="true"></span></header>
<div class="camp-title"><h1>鸭命要紧<i>!</i></h1><p>今日也要平安上岸</p></div>
<div class="mission-card"><span>救援任务</span><strong id="mission-title">第 01 次 · 雨衣鸭</strong></div>
<div class="camp-actions"><button id="start-rescue" class="orange">出发救鸭 <span>→</span></button><button id="daily-open" class="envelope" aria-label="打开每日补给"><span>✉</span>补给<i id="daily-dot"></i></button><button id="resume-rescue" class="quiet" hidden>继续上次救援 →</button><a id="model-compare" href="./wizard-duck.html" target="_blank" rel="noopener">法师鸭 · 清晰度对比与试玩 ↗</a></div>
<nav class="camp-nav" aria-label="营地导航"><button class="selected" id="camp-tab">⌂ <span>营地</span></button><button data-open-album>▱ <span>图鉴</span></button></nav>
</section>
<section id="game-view" hidden aria-label="救援进行中"><iframe id="game-frame" title="鸭鸭救援关卡" allow="autoplay"></iframe><button id="loading-back" hidden>返回营地</button></section>
<div id="daily-overlay" class="camp-overlay" hidden><section class="supply-letter" role="dialog" aria-modal="true" aria-labelledby="daily-title"><button id="daily-close" class="close" aria-label="关闭每日补给">×</button><h2 id="daily-title">每日补给</h2><div class="supply-art" aria-hidden="true"><span class="parcel">▰</span><span class="reorder-ticket">⇄</span></div><h3>随机重排 ×1</h3><p>带上一点好运，救出下一位伙伴。</p><button id="claim-daily" class="teal">收下补给</button><p id="daily-status"></p><small>本机试玩补给 · 无需分享</small></section></div>
<div id="settings-overlay" class="camp-overlay" hidden><section class="settings-sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title"><button id="settings-close" class="close" aria-label="关闭设置">×</button><h2 id="settings-title">营地设置</h2><button id="music-toggle" class="setting-row" role="switch"><span>♫ 背景音乐</span><i></i></button><button id="effects-toggle" class="setting-row" role="switch"><span>♩ 点击与消除音效</span><i></i></button><p>你的声音偏好会保存在这台设备。</p></section></div>
<div id="manual-root"></div><button id="album-button" hidden></button><div id="toast" role="status"></div></main><script type="module" src="./main.js"></script></body></html>
