server.address=${ROSE_BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${ROSE_DATABASE_URL:jdbc:h2:file:./data/album;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${ROSE_DATABASE_USER:sa}
spring.datasource.password=${ROSE_DATABASE_PASSWORD:}
spring.sql.init.mode=always
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.log-request-details=false
rose.wechat.app-id=${WECHAT_APP_ID:}
rose.wechat.app-secret=${WECHAT_APP_SECRET:}
rose.session.ttl-seconds=${ROSE_SESSION_TTL_SECONDS:604800}
